<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeniCare — Video Demo 9:16 (TikTok / Reels)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#020c0b;--teal:#2dd4bf;--ink:#f0fdfa;--mute:#6ba8a0}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 10px 28px;gap:10px}
h1{font-size:18px;font-weight:800;text-align:center;background:linear-gradient(90deg,#5eead4,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--mute);text-align:center;max-width:400px;line-height:1.5}

/* Stage 9:16 */
.stage{position:relative;width:100%;max-width:320px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;box-shadow:0 16px 48px #000a,0 0 0 2px #2dd4bf22;background:#050e0d}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease;will-change:transform,opacity}
.stage img.ken{animation:ken 7s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1%,-2%)}}

/* Top bar */
.top-bar{position:absolute;top:0;left:0;right:0;z-index:10;padding:12px 14px 6px}
.prog-bg{height:4px;border-radius:3px;background:rgba(255,255,255,0.15);overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#0d9488,#5eead4);transition:width .3s linear}
.watermark{margin-top:6px;display:inline-block;font-size:11px;font-weight:800;color:#99f6e4;background:rgba(0,0,0,0.3);padding:3px 10px;border-radius:12px;backdrop-filter:blur(4px)}

/* Scene tag */
.scene-tag{position:absolute;top:52px;left:14px;right:14px;z-index:10;text-align:center}
.tag-pill{display:inline-block;background:rgba(13,148,136,0.75);backdrop-filter:blur(4px);border:1px solid rgba(94,234,212,0.3);padding:5px 16px;border-radius:14px;font-size:12px;font-weight:800;color:#5eead4;letter-spacing:.4px;text-transform:uppercase}

/* Karaoke captions */
.captions{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:0 12px 16px;text-align:center;pointer-events:none}
.cap-bg{background:linear-gradient(transparent,rgba(0,0,0,0.75));padding:16px 8px 12px;border-radius:0 0 18px 18px}
.cap-line{font-size:17px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.7);line-height:1.4;letter-spacing:.2px}
.cap-line .hl{background:linear-gradient(135deg,#0d9488,#0ea5e9);color:#fff;padding:1px 7px;border-radius:6px;display:inline}

/* Overlay for audio gate */
.gate{position:absolute;inset:0;z-index:20;background:rgba(2,12,11,.8);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;transition:opacity .4s}
.gate.off{opacity:0;pointer-events:none}
.gate-btn{width:84px;height:84px;border-radius:50%;border:0;background:linear-gradient(135deg,#0d9488,#5eead4);color:#041412;display:flex;align-items:center;justify-content:center;box-shadow:0 0 44px #2dd4bf66;animation:gp 2s ease-in-out infinite alternate}
@keyframes gp{from{box-shadow:0 0 20px #2dd4bf44}to{box-shadow:0 0 60px #2dd4bfaa}}
.gate-btn svg{width:38px;height:38px}
.gate-txt{font-size:13px;font-weight:800;color:#fff;background:rgba(0,0,0,.5);padding:6px 16px;border-radius:99px}

/* Controls */
.ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;max-width:380px}
.ctl button,.ctl a.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px;transition:transform .1s;text-decoration:none;line-height:1.3}
.ctl button:active{transform:scale(.96)}
.p{background:linear-gradient(135deg,#0d9488,#2dd4bf);color:#041412}
.o{background:#0d1f1e;color:var(--ink);border:1px solid #ffffff18}
.rec{background:linear-gradient(135deg,#be123c,#f43f5e);color:#fff}
.status{font-size:11.5px;color:var(--teal);min-height:16px;text-align:center;font-weight:700}
</style>
</head>
<body>
<h1>GeniCare — Video Demo 9:16</h1>
<p class="sub">Animasi 3D diorama clay-felt ala TikTok edukasi kesehatan + narasi bahasa Indonesia + musik lo-fi.</p>

<div class="stage" id="stage">
  <!-- Scene images preloaded -->
  <img id="scImg" class="ken" src="assets/scenes/scene1_hook.jpg" alt="Scene">

  <!-- Top progress bar -->
  <div class="top-bar">
    <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <span class="watermark">GENICARE 2026</span>
  </div>

  <!-- Scene tag -->
  <div class="scene-tag"><span class="tag-pill" id="tagPill">TAHUKAH KAMU?</span></div>

  <!-- Karaoke captions bottom -->
  <div class="captions">
    <div class="cap-bg">
      <p class="cap-line" id="capLine"></p>
    </div>
  </div>

  <!-- Audio gate -->
  <div class="gate" id="gate">
    <button class="gate-btn" type="button" aria-label="Putar dengan suara">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <span class="gate-txt">Ketuk untuk Putar + Narasi + Musik</span>
  </div>
</div>

<div class="ctl">
  <button class="p" id="playBtn">Putar / Jeda</button>
  <button class="o" id="repBtn">Ulangi</button>
  <button class="o" id="muteBtn">Suara: Nyala</button>
  <button class="rec" id="recBtn">Rekam &amp; Unduh (.webm)</button>
  <a class="btn o" href="index.html">Buka Aplikasi</a>
</div>
<p class="status" id="st">Ketuk tombol di video untuk mulai dengan narasi &amp; musik</p>

<script>
/* ═══════════════════════════════════════════════════════════════
   GeniCare Demo — 3D Diorama Slideshow + TTS + Lo-fi Music
   ═══════════════════════════════════════════════════════════════ */

/* ── Scene data ── */
const SCENES = [
  {
    img: 'assets/scenes/scene1_hook.jpg',
    tag: 'TAHUKAH KAMU?',
    dur: 7,
    captions: [
      { t:0.3,  text: '<span class="hl">Tahukah kamu?</span> Menahan kencing itu berbahaya!' },
      { t:2.5,  text: 'Dzaky sering <span class="hl">menahan kencing</span> saat sibuk...' },
      { t:4.8,  text: 'Padahal bisa memicu <span class="hl">ISK</span> dan <span class="hl">Batu Ginjal!</span>' },
    ],
    narration: 'Tahukah kamu? Menahan kencing itu sangat berbahaya! Dzaky sering menahan kencing saat sibuk, padahal kebiasaan ini bisa memicu Infeksi Saluran Kemih dan Batu Ginjal!'
  },
  {
    img: 'assets/scenes/scene2_hidrasi.jpg',
    tag: 'SOLUSI: HIDRASI CUKUP',
    dur: 6,
    captions: [
      { t:0.3,  text: 'Dr. Hana: "Minum air putih <span class="hl">cukup setiap hari!"</span>' },
      { t:2.5,  text: '<span class="hl">GeniCare</span> membantu pantau minum &amp; berkemih harian.' },
      { t:4.5,  text: 'Lihat <span class="hl">progres hidrasi</span> dan catatan harianmu.' },
    ],
    narration: 'Solusinya mudah! Dr. Hana menyarankan minum air putih yang cukup setiap hari. Aplikasi GeniCare membantu Dzaky memantau minum dan berkemih harian, lengkap dengan progres hidrasi.'
  },
  {
    img: 'assets/scenes/scene3_pengingat.jpg',
    tag: 'FITUR PENGINGAT KENCING',
    dur: 6,
    captions: [
      { t:0.3,  text: 'Atur <span class="hl">pengingat berkemih</span> sesuai jadwalmu.' },
      { t:2.3,  text: 'Mode <span class="hl">interval</span> atau <span class="hl">jam tertentu.</span>' },
      { t:4.3,  text: 'Pantau juga <span class="hl">warna urine</span> sebagai indikator kesehatan.' },
    ],
    narration: 'GeniCare punya fitur pengingat berkemih yang bisa diatur sesuai jadwalmu. Pilih mode interval atau jadwal jam tertentu. Kamu juga bisa memantau warna urine sebagai indikator kesehatan.'
  },
  {
    img: 'assets/scenes/scene4_edukasi.jpg',
    tag: '8 MATERI EDUKASI',
    dur: 7,
    captions: [
      { t:0.3,  text: '<span class="hl">8 materi edukasi</span> lengkap dari Dr. Hana.' },
      { t:2.5,  text: 'ISK, Batu Ginjal, AKI, CKD, BPH, <span class="hl">dan lainnya.</span>' },
      { t:4.8,  text: 'Disajikan dalam format <span class="hl">animasi interaktif!</span>' },
    ],
    narration: 'Dr. Hana mengajarkan 8 materi edukasi lengkap, mulai dari Infeksi Saluran Kemih, Batu Ginjal, AKI, CKD, BPH, Hidronefrosis, dan lainnya. Semua disajikan dalam format animasi interaktif yang menyenangkan!'
  },
  {
    img: 'assets/scenes/scene5_keluhan.jpg',
    tag: 'CEK KELUHAN & AI CHAT',
    dur: 6,
    captions: [
      { t:0.3,  text: 'Ada keluhan? <span class="hl">Cek urgensinya</span> di GeniCare.' },
      { t:2.3,  text: 'Sistem <span class="hl">traffic light:</span> Hijau, Kuning, Merah.' },
      { t:4.3,  text: 'Tanya AI kapan saja untuk <span class="hl">panduan cepat!</span>' },
    ],
    narration: 'Punya keluhan kesehatan? Cek urgensinya di GeniCare menggunakan sistem traffic light. Hijau berarti pantau mandiri, kuning berarti konsultasi dokter, dan merah berarti segera ke IGD! Kamu juga bisa tanya AI kapan saja untuk panduan cepat.'
  },
  {
    img: 'assets/scenes/scene6_outro.jpg',
    tag: 'DOWNLOAD GRATIS',
    dur: 6,
    captions: [
      { t:0.3,  text: '<span class="hl">GeniCare</span> — Kenali, Pantau, Jaga Kesehatanmu.' },
      { t:2.3,  text: 'Bersama <span class="hl">Dzaky &amp; Dr. Hana,</span> kesehatan jadi mudah!' },
      { t:4.3,  text: '<span class="hl">Download gratis</span> sekarang!' },
    ],
    narration: 'GeniCare, Kenali, Pantau, dan Jaga Kesehatanmu! Bersama Dzaky dan Dr. Hana, menjaga kesehatan jadi lebih mudah dan menyenangkan. Download gratis sekarang!'
  },
];

const TOTAL_DUR = SCENES.reduce((s,sc) => s + sc.dur, 0);

/* ── State ── */
let t = 0, playing = false, muted = false, recording = false;
let lastNow = performance.now(), curScene = -1;

/* ── DOM ── */
const img     = document.getElementById('scImg');
const progBar = document.getElementById('progFill');
const tagPill = document.getElementById('tagPill');
const capLine = document.getElementById('capLine');
const st      = document.getElementById('st');

/* ── Preload images ── */
SCENES.forEach(sc => { const i = new Image(); i.src = sc.img; });

/* ── Determine scene from t ── */
function sceneAt(time) {
  let acc = 0;
  for (let i = 0; i < SCENES.length; i++) {
    if (time < acc + SCENES[i].dur) return { idx: i, local: time - acc };
    acc += SCENES[i].dur;
  }
  return { idx: SCENES.length - 1, local: SCENES[SCENES.length - 1].dur };
}

/* ── Update visuals ── */
function updateVisuals() {
  const { idx, local } = sceneAt(t);
  progBar.style.width = (t / TOTAL_DUR * 100) + '%';

  if (idx !== curScene) {
    curScene = idx;
    const sc = SCENES[idx];
    img.style.opacity = '0';
    setTimeout(() => { img.src = sc.img; img.style.opacity = '1'; }, 150);
    tagPill.textContent = sc.tag;
    if (playing && !muted) speakNarration(sc.narration);
    playSfx('whoosh');
  }

  /* Karaoke caption */
  const sc = SCENES[idx];
  let activeCap = '';
  for (let i = sc.captions.length - 1; i >= 0; i--) {
    if (local >= sc.captions[i].t) { activeCap = sc.captions[i].text; break; }
  }
  capLine.innerHTML = activeCap;
}

/* ── Main loop ── */
function loop(now) {
  const dt = Math.min(0.06, (now - lastNow) / 1000);
  lastNow = now;
  if (playing) {
    t += dt;
    if (t >= TOTAL_DUR) {
      if (recording) { stopRecording(); t = TOTAL_DUR; playing = false; }
      else { t = 0; curScene = -1; }
    }
    updateVisuals();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═══════════════════════════════════════════════════════════════
   AUDIO — Indonesian TTS Narration + Lo-fi Music + SFX
   ═══════════════════════════════════════════════════════════════ */

let ac, masterGain, musicInterval, musicStep = 0;

function initAC() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ac.createGain(); masterGain.gain.value = 0.6;
    masterGain.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
}

/* ── TTS Narration (Indonesian) ── */
function stopNarration() {
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch {}
}

function speakNarration(text) {
  stopNarration();
  if (muted || !playing || !text) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID'; u.rate = 1.02; u.pitch = 1.0;
    const voices = speechSynthesis.getVoices();
    const idV = voices.find(v => v.lang && v.lang.startsWith('id'));
    if (idV) u.voice = idV;
    speechSynthesis.speak(u);
  } catch {}
}

/* ── Lo-fi warm music (soft background) ── */
function warmNote(freq, dur, vol, type='sine') {
  if (!ac || muted) return;
  const now = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(vol, now + 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.start(now); o.stop(now + dur + 0.05);
}

function startMusic() {
  stopMusic();
  if (muted) return;
  initAC();
  const chords = [
    [261.63, 329.63, 392.00],  // C
    [220.00, 261.63, 329.63],  // Am
    [174.61, 220.00, 261.63],  // F
    [196.00, 246.94, 293.66],  // G
  ];
  const melody = [523.25, 493.88, 440, 392, 349.23, 392, 440, 493.88, 523.25, 587.33, 523.25, 440];
  const bass = [130.81, 110.00, 87.31, 98.00];

  musicInterval = setInterval(() => {
    if (!playing || muted || !ac) return;
    const bar = Math.floor(musicStep / 8) % 4;

    // Soft kick on beat
    if (musicStep % 4 === 0) {
      const ko = ac.createOscillator(), kg = ac.createGain();
      ko.type = 'sine'; const now = ac.currentTime;
      ko.frequency.setValueAtTime(90, now);
      ko.frequency.exponentialRampToValueAtTime(35, now + 0.1);
      kg.gain.setValueAtTime(0.18, now);
      kg.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      ko.connect(kg); kg.connect(masterGain);
      ko.start(now); ko.stop(now + 0.14);
    }

    // Bass
    warmNote(bass[bar], 0.5, 0.06, 'triangle');

    // Chord pad (every 4th step)
    if (musicStep % 4 === 0) {
      chords[bar].forEach(f => warmNote(f, 1.6, 0.025));
    }

    // Melody (marimba-like pluck)
    warmNote(melody[musicStep % melody.length], 0.35, 0.04, 'triangle');

    musicStep++;
  }, 380);
}

function stopMusic() { clearInterval(musicInterval); musicInterval = null; }

/* ── SFX ── */
function playSfx(type) {
  if (muted || !ac) return;
  const now = ac.currentTime;
  if (type === 'whoosh') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(300, now);
    o.frequency.exponentialRampToValueAtTime(800, now + 0.12);
    g.gain.setValueAtTime(0.15, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    o.connect(g); g.connect(masterGain);
    o.start(now); o.stop(now + 0.2);
  }
}

/* ═══════════════════════════════════════════════════════════════
   RECORDING (Canvas capture via html2canvas fallback or screenshot)
   For now we record the stage div with MediaRecorder if supported
   ═══════════════════════════════════════════════════════════════ */
let recorder, chunks = [];

function startRecording() {
  t = 0; curScene = -1; playing = true; recording = true;
  document.getElementById('gate').classList.add('off');
  initAC(); startMusic(); updateVisuals();

  /* Use a canvas to capture the stage — simple approach: capture canvas of stage */
  try {
    const stageEl = document.getElementById('stage');
    /* Create off-screen canvas and paint frames */
    const rCanvas = document.createElement('canvas');
    rCanvas.width = 720; rCanvas.height = 1280;
    const rCtx = rCanvas.getContext('2d');

    const vStream = rCanvas.captureStream(30);
    chunks = [];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
    recorder = new MediaRecorder(vStream, { mimeType: mime });
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'genicare-demo-9x16.webm'; a.click();
      st.textContent = 'Selesai! File genicare-demo-9x16.webm sudah diunduh.';
    };

    /* Paint loop */
    function paintRec() {
      if (!recording) return;
      const curImg = document.getElementById('scImg');
      if (curImg.complete && curImg.naturalHeight > 0) {
        rCtx.drawImage(curImg, 0, 0, 720, 1280);
      }
      /* Draw caption overlay */
      rCtx.fillStyle = 'rgba(0,0,0,0.5)';
      rCtx.fillRect(0, 1120, 720, 160);
      rCtx.fillStyle = '#fff';
      rCtx.font = '800 34px "Plus Jakarta Sans",sans-serif';
      rCtx.textAlign = 'center'; rCtx.textBaseline = 'middle';
      const capText = capLine.textContent || '';
      rCtx.fillText(capText, 360, 1200, 680);

      /* Tag */
      rCtx.fillStyle = 'rgba(13,148,136,0.75)';
      rCtx.fillRect(200, 90, 320, 40);
      rCtx.fillStyle = '#5eead4';
      rCtx.font = '800 22px "Plus Jakarta Sans",sans-serif';
      rCtx.fillText(tagPill.textContent, 360, 112);

      /* Progress bar */
      rCtx.fillStyle = '#ffffff33';
      rCtx.fillRect(36, 36, 648, 6);
      rCtx.fillStyle = '#5eead4';
      rCtx.fillRect(36, 36, 648 * (t / TOTAL_DUR), 6);

      requestAnimationFrame(paintRec);
    }
    paintRec();
    recorder.start();
    st.textContent = 'Merekam video + narasi (0–' + TOTAL_DUR + ' detik)... Mohon tunggu.';
  } catch (e) {
    st.textContent = 'Gagal merekam: ' + e.message;
    recording = false;
  }
}

function stopRecording() {
  recording = false;
  if (recorder && recorder.state === 'recording') recorder.stop();
}

/* ═══════════════════════════════════════════════════════════════
   CONTROLS
   ═══════════════════════════════════════════════════════════════ */

function unlockAndPlay() {
  document.getElementById('gate').classList.add('off');
  playing = true;
  initAC();
  startMusic();
  curScene = -1;
  updateVisuals();
  st.textContent = 'Memutar demo dengan narasi Indonesia & musik lo-fi...';
}

document.getElementById('gate').onclick = unlockAndPlay;

document.getElementById('playBtn').onclick = () => {
  if (!playing) unlockAndPlay();
  else {
    playing = false; stopMusic(); stopNarration();
    st.textContent = 'Dijeda';
  }
};

document.getElementById('repBtn').onclick = () => {
  t = 0; curScene = -1; unlockAndPlay();
};

document.getElementById('muteBtn').onclick = e => {
  muted = !muted;
  e.target.textContent = muted ? 'Suara: Mati' : 'Suara: Nyala';
  if (muted) { stopMusic(); stopNarration(); }
  else if (playing) { startMusic(); const { idx } = sceneAt(t); speakNarration(SCENES[idx].narration); }
};

document.getElementById('recBtn').onclick = () => { if (!recording) startRecording(); };

/* Preload voices */
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
</script>
</body>
</html>
