<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeniCare — Video Demo 9:16 (TikTok / Reels)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#041412;--card:#0d2220;--teal:#2dd4bf;--ink:#f0fdfa;--mute:#86b6b0}
  *{box-sizing:border-box;margin:0}
  body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px;gap:10px}
  h1{font-size:19px;font-weight:800;text-align:center;background:linear-gradient(90deg,#5eead4,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:12.5px;color:var(--mute);text-align:center;max-width:420px;line-height:1.5}
  .stage-wrap{position:relative;width:100%;max-width:320px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;box-shadow:0 20px 56px #000b,0 0 0 2px #2dd4bf33;background:#050f0e}
  canvas{width:100%;height:100%;display:block}
  .audio-gate{position:absolute;inset:0;background:rgba(2,14,13,.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;z-index:5;transition:opacity .3s}
  .audio-gate.off{opacity:0;pointer-events:none}
  .play-big{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#0d9488,#5eead4);color:#041412;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 0 40px #2dd4bf55;animation:gate-pulse 2s ease-in-out infinite alternate}
  @keyframes gate-pulse{from{box-shadow:0 0 24px #2dd4bf44}to{box-shadow:0 0 56px #2dd4bfaa,0 0 80px #2dd4bf44}}
  .play-big svg{width:36px;height:36px}
  .gate-txt{font-size:13.5px;font-weight:800;color:#fff;background:#00000077;padding:7px 18px;border-radius:99px;letter-spacing:.2px}
  .ctl{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:100%;max-width:400px}
  button,a.btn{font:inherit;font-weight:700;border:0;border-radius:11px;padding:9px 13px;cursor:pointer;font-size:12.5px;transition:transform .12s,opacity .12s;line-height:1.3}
  button:active,a.btn:active{transform:scale(.96)}
  .p{background:linear-gradient(135deg,#0d9488,#2dd4bf);color:#041412}
  .o{background:var(--card);color:var(--ink);border:1px solid #ffffff20}
  .rec{background:linear-gradient(135deg,#be123c,#f43f5e);color:#fff}
  .status{font-size:12px;color:var(--teal);min-height:17px;text-align:center;font-weight:700;letter-spacing:.1px}
</style>
</head>
<body>
  <h1>GeniCare — Video Demo 9:16</h1>
  <p class="sub">Animasi TikTok-style vertikal dengan karakter Dzaky &amp; Dr. Hana, musik beat, dan SFX.</p>
  <div class="stage-wrap">
    <canvas id="cv" width="720" height="1280"></canvas>
    <div class="audio-gate" id="gate">
      <button class="play-big" type="button" aria-label="Putar dengan suara">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <span class="gate-txt">Ketuk untuk Putar + Musik</span>
    </div>
  </div>
  <div class="ctl">
    <button class="p" id="playBtn">▶ Putar / Jeda</button>
    <button class="o" id="repBtn">↺ Ulangi</button>
    <button class="o" id="muteBtn">Suara: Nyala</button>
    <button class="rec" id="recBtn">⏺ Rekam &amp; Unduh (.webm)</button>
    <a class="btn o" href="index.html">← Buka Aplikasi</a>
  </div>
  <p class="status" id="st">Ketuk tombol ▶ di video untuk mulai dengan musik &amp; SFX</p>

<script>
/* ═══════════════════════════════════════════════════════════════
   GeniCare Demo Video 9:16 — Full Animation Engine
   Karakter: Dzaky (teal shirt) & Dr. Hana (white coat)
   Scenes: 6 scenes × ~5.5 detik = 33 detik total
   ═══════════════════════════════════════════════════════════════ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 720, H = 1280, DUR = 33;
let t = 0, playing = false, last = performance.now(), muted = false, recording = false;
let lastScene = -1;

/* ── Easing ── */
const easeOut  = x => 1 - Math.pow(Math.max(0, Math.min(1, 1 - x)), 3);
const easeBack = x => { const c1=1.70158, c3=c1+1, k=Math.max(0,Math.min(1,x)); return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2); };
const easeIn   = x => Math.pow(Math.max(0, Math.min(1, x)), 2);
const seg = (s, e) => Math.max(0, Math.min(1, (t - s) / (e - s)));
const lerp = (a, b, k) => a + (b - a) * k;

/* ── Beat timing ── */
const BPM = 108, BEAT = 60 / BPM;
const beat = () => Math.abs(Math.sin(t * Math.PI / BEAT));

/* ── Draw helpers ── */
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

function shadow(blur = 20, color = 'rgba(0,0,0,0.5)', ox = 0, oy = 8) {
  ctx.shadowBlur = blur; ctx.shadowColor = color; ctx.shadowOffsetX = ox; ctx.shadowOffsetY = oy;
}
function noShadow() { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; }

function txt(str, x, y, size=32, color='#fff', align='center', weight='800', maxW=660) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px "Plus Jakarta Sans","Segoe UI",sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  const words = str.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  const lh = size * 1.28;
  lines.forEach((l, i) => ctx.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh));
  ctx.restore();
}

function txtStroke(str, x, y, size, color, strokeColor, align='center', maxW=660) {
  ctx.save();
  ctx.font = `800 ${size}px "Plus Jakarta Sans","Segoe UI",sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.strokeStyle = strokeColor; ctx.lineWidth = size * 0.12;
  ctx.lineJoin = 'round';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   KARAKTER — Dzaky & Dr. Hana
   ═══════════════════════════════════════════════════════════════ */

/**
 * Gambar karakter manusia animasi gaya 2D flat.
 * @param {number} cx   center-x
 * @param {number} cy   bottom-y (kaki)
 * @param {string} role 'dzaky'|'doctor'|'pain'|'drink'
 * @param {number} sc   scale
 * @param {number} flip -1 untuk mirror
 */
function drawChar(cx, cy, role='dzaky', sc=1, flip=1) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(flip * sc, sc);

  const bob   = Math.sin(t * 5.2) * 3.5;      // naik-turun
  const sway  = Math.sin(t * 2.6) * 1.8;      // goyang kiri-kanan
  const wave  = Math.sin(t * 7.4);             // tangan melambai
  const blink = (Math.sin(t * 3.1) > 0.92) ? 0.3 : 1; // kedip

  ctx.translate(sway, bob);

  /* Bayangan tanah */
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 2, 32*sc, 7*sc, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  /* ── Sepatu ── */
  const shoeCol = role==='doctor' ? '#1e293b' : '#0f172a';
  [-13, 13].forEach(sx => {
    ctx.fillStyle = shoeCol;
    ctx.beginPath(); ctx.ellipse(sx, 0, 12, 7, sx>0?0.1:-0.1, 0, Math.PI*2); ctx.fill();
  });

  /* ── Celana / rok bawah ── */
  const pantsCol = role==='doctor' ? '#1e3a5f' : '#0d3346';
  ctx.fillStyle = pantsCol;
  rr(-22, -60, 44, 62, [0,0,8,8], pantsCol);
  /* garis tengah celana */
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,-58); ctx.lineTo(0,-2); ctx.stroke();

  /* ── Badan / Baju ── */
  const bodyCol = role==='doctor' ? '#ffffff'
                : role==='pain'   ? '#f43f5e'
                : role==='drink'  ? '#06b6d4'
                :                   '#14b8a6';
  rr(-28, -130, 56, 76, [14,14,2,2], bodyCol);

  if (role==='doctor') {
    /* Jas putih detail: kerah + kancing */
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.moveTo(-28,-130); ctx.lineTo(-16,-130); ctx.lineTo(0,-108); ctx.lineTo(16,-130); ctx.lineTo(28,-130);
    ctx.lineTo(28,-96); ctx.lineTo(-28,-96); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0d9488';
    ctx.beginPath(); ctx.arc(0,-118,16,0,Math.PI); ctx.fill(); /* kerah teal */
    [0,-4,-8].forEach(ky => { ctx.fillStyle='#94a3b8'; ctx.beginPath(); ctx.arc(0,-114+ky*2.5,2.5,0,Math.PI*2); ctx.fill(); });
    /* stetoskop */
    ctx.strokeStyle='#64748b'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,-114,10,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10,-114+10); ctx.lineTo(-10,-96); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10,-114+10); ctx.lineTo(10,-96); ctx.stroke();
    ctx.fillStyle='#64748b'; ctx.beginPath(); ctx.arc(0,-96,5,0,Math.PI*2); ctx.fill();
  } else {
    /* Stripe / logo kaos */
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(-16,-120); ctx.lineTo(16,-120); ctx.stroke();
  }

  /* ── Leher ── */
  ctx.fillStyle='#f4c8a0';
  rr(-8,-148,16,22,[4,4,0,0],'#f4c8a0');

  /* ── Kepala ── */
  ctx.save(); ctx.translate(0, -172);
  /* rambut belakang */
  ctx.fillStyle = role==='doctor' ? '#4a1942' : '#1e293b';
  ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI*2); ctx.fill();

  /* wajah */
  ctx.fillStyle='#f9d5b3';
  ctx.beginPath(); ctx.arc(0, 4, 29, 0, Math.PI*2); ctx.fill();

  /* rambut depan */
  ctx.fillStyle = role==='doctor' ? '#4a1942' : '#1e293b';
  if (role==='doctor') {
    /* rambut panjang dokter wanita */
    ctx.beginPath(); ctx.moveTo(-29,-6); ctx.quadraticCurveTo(-36,-2,-34,22); ctx.quadraticCurveTo(-30,30,-20,32); ctx.lineTo(-18,8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(29,-6); ctx.quadraticCurveTo(36,-2,34,22); ctx.quadraticCurveTo(30,30,20,32); ctx.lineTo(18,8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-12,32,Math.PI,Math.PI*2); ctx.fill();
    /* jepit rambut */
    ctx.fillStyle='#f43f5e';
    ctx.beginPath(); ctx.arc(-18,-12,5,0,Math.PI*2); ctx.fill();
  } else {
    /* rambut laki-laki Dzaky */
    ctx.beginPath(); ctx.arc(0,-12,32,Math.PI,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-29,-10); ctx.quadraticCurveTo(-24,-24,-14,-26); ctx.quadraticCurveTo(0,-30,14,-26); ctx.quadraticCurveTo(24,-24,29,-10); ctx.lineTo(29,2); ctx.lineTo(-29,2); ctx.closePath(); ctx.fill();
  }

  /* ── Mata ── */
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.ellipse(-10, 4, 7.5, 7.5*blink, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10, 4, 7.5, 7.5*blink, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = role==='doctor' ? '#5b2d8e' : '#1e293b';
  ctx.beginPath(); ctx.arc(-10, 4, 4.5, 0, Math.PI*2); ctx.arc(10, 4, 4.5, 0, Math.PI*2); ctx.fill();
  /* kilat mata */
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(-8,2,1.8,0,Math.PI*2); ctx.arc(12,2,1.8,0,Math.PI*2); ctx.fill();

  /* ── Alis ── */
  ctx.strokeStyle='#5c3a1a'; ctx.lineWidth=3; ctx.lineCap='round';
  if (role==='pain') {
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(-6,-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16,-6); ctx.lineTo(6,-2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-17,-4); ctx.quadraticCurveTo(-10,-10,-3,-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(17,-4); ctx.quadraticCurveTo(10,-10,3,-4); ctx.stroke();
  }

  /* ── Hidung ── */
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.beginPath(); ctx.ellipse(0,10,3.5,2.5,0,0,Math.PI*2); ctx.fill();

  /* ── Mulut ── */
  ctx.strokeStyle = role==='pain' ? '#dc2626' : '#c0392b'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath();
  if (role==='pain') {
    ctx.arc(0, 22, 9, 0.2*Math.PI, 0.8*Math.PI, true);
  } else if (role==='drink') {
    ctx.arc(0, 18, 11, 0.1*Math.PI, 0.9*Math.PI);
  } else {
    ctx.arc(0, 19, 10, 0.1*Math.PI, 0.9*Math.PI);
  }
  ctx.stroke();
  /* Blush pipi */
  ctx.fillStyle='rgba(255,100,100,0.18)';
  ctx.beginPath(); ctx.ellipse(-18,14,10,6,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(18,14,10,6,0,0,Math.PI*2); ctx.fill();

  ctx.restore(); /* kepala */

  /* ── Tangan kiri (bergerak) ── */
  ctx.save();
  ctx.translate(-28, -110);
  const armL = role==='pain' ? -0.3 + Math.sin(t*5)*0.15 : -0.6 + wave * 0.22;
  ctx.rotate(armL);
  ctx.strokeStyle = bodyCol; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-6,36); ctx.stroke();
  /* Telapak */
  ctx.fillStyle='#f9d5b3';
  ctx.beginPath(); ctx.ellipse(-8,40,10,8,armL+0.3,0,Math.PI*2); ctx.fill();
  if (role==='drink') {
    /* Gelas minum */
    ctx.fillStyle='#bae6fd'; rr(-26,28,22,32,6,'#bae6fd');
    ctx.fillStyle='#38bdf8'; rr(-24,38,18,14,4,'#38bdf8');
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-26,34); ctx.lineTo(-4,34); ctx.stroke();
  }
  ctx.restore();

  /* ── Tangan kanan (melambai/stethoscope) ── */
  ctx.save();
  ctx.translate(28, -110);
  const armR = role==='doctor' ? 0.4 + wave*0.18 : 0.5 + wave*0.25;
  ctx.rotate(armR);
  ctx.strokeStyle = bodyCol; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(6,36); ctx.stroke();
  ctx.fillStyle='#f9d5b3';
  ctx.beginPath(); ctx.ellipse(8,40,10,8,armR-0.3,0,Math.PI*2); ctx.fill();
  if (role==='doctor') {
    /* Clipboard dokter */
    ctx.save(); ctx.rotate(-armR+0.1);
    rr(2,24,34,46,6,'#f1f5f9','#cbd5e1',2);
    rr(10,28,18,8,3,'#0d9488');
    ctx.fillStyle='#64748b'; ctx.lineWidth=1.5;
    [[10,42,24],[10,52,20],[10,62,16]].forEach(([rx,ry,rw])=>{
      ctx.beginPath(); ctx.roundRect(rx,ry,rw,4,2); ctx.fill();
    });
    ctx.restore();
  }
  ctx.restore();

  /* Pain effects */
  if (role==='pain') {
    const sp = Math.sin(t*8)*0.5+0.5;
    ['#fde047','#f97316','#ef4444'].forEach((c,i)=>{
      const sx = 36+i*8, sy = -180-i*10;
      ctx.fillStyle=c; ctx.globalAlpha=sp*(0.9-i*0.2);
      ctx.beginPath(); ctx.arc(sx,sy,4+i*2,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
  }
}

/* ═══════════════════════════════════════════════════════════════
   ORGAN ANIMASI
   ═══════════════════════════════════════════════════════════════ */

function drawKidney(cx, cy, sc=1) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  const pulse = beat()*0.12;

  [-1,1].forEach(side => {
    ctx.save(); ctx.translate(side*68,0); ctx.rotate(side*0.18);
    const g = ctx.createLinearGradient(-36,-64,36,64);
    g.addColorStop(0,'#fb7185'); g.addColorStop(0.5,'#e11d48'); g.addColorStop(1,'#9f1239');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,0,36+pulse*8,62+pulse*10,0,0,Math.PI*2); ctx.fill();
    /* detail ginjal */
    ctx.fillStyle='rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.ellipse(-side*8,-14,10,16,0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(254,215,170,0.5)';
    ctx.beginPath(); ctx.ellipse(0,0,16,28,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  /* Ureter kiri & kanan + droplet animasi */
  ctx.strokeStyle='#fda4af'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-52,52); ctx.quadraticCurveTo(-24,120,-18,168); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(52,52); ctx.quadraticCurveTo(24,120,18,168); ctx.stroke();

  const dp1 = (t*1.4)%1, dp2 = (t*1.4+0.5)%1;
  const urL = (u) => { return {x:-52+u*34, y:52+u*116}; };
  const urR = (u) => { return {x:52-u*34, y:52+u*116}; };
  ['#fde047','#5eead4'].forEach((c,i)=>{
    ctx.fillStyle=c; const dp=i===0?dp1:dp2;
    const pL=urL(dp), pR=urR(dp);
    ctx.beginPath(); ctx.arc(pL.x,pL.y,8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(pR.x,pR.y,8,0,Math.PI*2); ctx.fill();
  });

  /* Kandung kemih */
  const bPulse = beat()*6;
  const bg = ctx.createRadialGradient(0,180,0,0,180,56+bPulse);
  bg.addColorStop(0,'#f43f5e'); bg.addColorStop(1,'#9f1239');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.ellipse(0,180,52+bPulse*0.4,46+bPulse*0.3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(253,224,71,0.8)';
  ctx.beginPath(); ctx.ellipse(0,190,28,13,0,0,Math.PI*2); ctx.fill();

  /* Label */
  ctx.restore();
}

function drawBacteria(x,y,r,color='#dc2626') {
  const sp=Math.sin(t*6+x)*4;
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x, y+sp, r, 0, Math.PI*2); ctx.fill();
  /* flagela */
  ctx.strokeStyle=color+'88'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+r,y+sp); ctx.quadraticCurveTo(x+r+8,y+sp-6,x+r+4,y+sp+4); ctx.stroke();
}

/* ═══════════════════════════════════════════════════════════════
   PHONE MOCKUP
   ═══════════════════════════════════════════════════════════════ */

function drawPhone(x, y, w, h, title, fn) {
  ctx.save();
  shadow(44,'rgba(0,0,0,0.6)',0,20);
  rr(x, y, w, h, 48, '#0a0f1a', '#2dd4bf66', 3);
  noShadow();

  /* Screen */
  rr(x+12, y+12, w-24, h-24, 38, '#f8fafb');

  /* Notch */
  rr(x+w/2-54, y+20, 108, 18, 9, '#1e293b');
  ctx.fillStyle='#374151'; ctx.beginPath(); ctx.arc(x+w/2+28,y+29,5,0,Math.PI*2); ctx.fill();

  /* Status bar */
  ctx.fillStyle='#64748b'; ctx.font='600 14px "Plus Jakarta Sans",sans-serif'; ctx.textAlign='left';
  ctx.fillText('9:41', x+28, y+48);
  /* Baterai mini */
  rr(x+w-66,y+38,32,16,4,'none','#64748b',2);
  rr(x+w-64,y+40,20,12,3,'#16a34a');

  /* Header gradient */
  rr(x+12, y+12, w-24, 94, [38,38,0,0], '#0d9488');
  txt(title, x+w/2, y+72, 20, '#fff', 'center', '800', w-50);

  /* Content clip */
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x+12, y+106, w-24, h-118, [0,0,38,38]); ctx.clip();
  fn(x+22, y+114, w-44, h-136);
  ctx.restore();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   BACKGROUND
   ═══════════════════════════════════════════════════════════════ */

function drawBackground(sceneColor='#042f2e') {
  /* Gradient background */
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#031a18');
  g.addColorStop(0.4, sceneColor);
  g.addColorStop(1,'#020e0d');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  /* Beat radial glow */
  const b=beat();
  const rg = ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,340+b*70);
  rg.addColorStop(0,`rgba(45,212,191,${0.12+b*0.1})`);
  rg.addColorStop(1,'rgba(45,212,191,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);

  /* Floating particles */
  for(let i=0;i<16;i++){
    const px=((i*173+t*22)%(W+60))-30;
    const py=((i*251-t*(28+i*3))%H+H)%H;

    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
  }
}

/* ═══════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════ */

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (playing) {
    t += dt;
    if (t >= DUR) {
      if (recording) { stopRecording(); t = DUR; playing = false; }
      else { t = 0; lastScene = -1; }
    }
  }
  drawScene();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═══════════════════════════════════════════════════════════════
   AUDIO ENGINE — Musik beat + melodi + bass + SFX
   ═══════════════════════════════════════════════════════════════ */
let ac, beatInterval, masterGain, dest;

function initAudio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ac.createGain(); masterGain.gain.value = 0.6;
    dest = ac.createMediaStreamDestination();
    masterGain.connect(ac.destination);
    masterGain.connect(dest);
  }
  if (ac.state === 'suspended') ac.resume();
}

function note(freq, start, dur, type='sine', vol=0.15, dest2=null) {
  if (!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.001, start);
  g.gain.linearRampToValueAtTime(vol, start+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, start+dur);
  o.connect(g); g.connect(dest2 || masterGain);
  o.start(start); o.stop(start+dur+0.02);
}

function playSfx(type) {
  if (!ac || muted) return;
  const now = ac.currentTime;
  if (type==='whoosh') {
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(300,now); o.frequency.exponentialRampToValueAtTime(900,now+0.15);
    g.gain.setValueAtTime(0.25,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.2);
    o.connect(g); g.connect(masterGain); o.start(now); o.stop(now+0.22);
  }
}

/* Chord progression: I–V–VI–IV in C major (C,G,Am,F) */
const CHORD = [
  [261.63,329.63,392.00],  // C major
  [392.00,493.88,587.33],  // G major
  [220.00,261.63,329.63],  // A minor
  [174.61,220.00,261.63],  // F major
];
const MELODY = [523.25,587.33,659.25,698.46,783.99,698.46,659.25,587.33,523.25,493.88,523.25,587.33];
const BASS   = [130.81,196.00,110.00,174.61];

function startAudio() {
  if (muted) return;
  initAudio();
  clearInterval(beatInterval);
  let step = 0;
  beatInterval = setInterval(() => {
    if (!playing || muted || !ac) return;
    const now = ac.currentTime;
    const bar = Math.floor(step/8) % 4;

    /* Kick drum */
    if (step%2===0) {
      const ko=ac.createOscillator(), kg=ac.createGain();
      ko.type='sine'; ko.frequency.setValueAtTime(150,now); ko.frequency.exponentialRampToValueAtTime(45,now+0.12);
      kg.gain.setValueAtTime(0.42,now); kg.gain.exponentialRampToValueAtTime(0.001,now+0.15);
      ko.connect(kg); kg.connect(masterGain); ko.start(now); ko.stop(now+0.16);
    }
    /* Snare (hi-hat noise feel) */
    if (step%4===2) {
      const buf=ac.createBuffer(1,ac.sampleRate*0.08,ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5;
      const src=ac.createBufferSource(), sg=ac.createGain();
      const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2000; f.Q.value=0.5;
      src.buffer=buf; src.connect(f); f.connect(sg); sg.connect(masterGain);
      sg.gain.setValueAtTime(0.14,now); sg.gain.exponentialRampToValueAtTime(0.001,now+0.09);
      src.start(now); src.stop(now+0.1);
    }
    /* Hi-hat */
    if (step%2===1) {
      const buf2=ac.createBuffer(1,ac.sampleRate*0.04,ac.sampleRate);
      const d2=buf2.getChannelData(0);
      for(let i=0;i<d2.length;i++) d2[i]=(Math.random()*2-1);
      const src2=ac.createBufferSource(), sg2=ac.createGain();
      const f2=ac.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=8000;
      src2.buffer=buf2; src2.connect(f2); f2.connect(sg2); sg2.connect(masterGain);
      sg2.gain.setValueAtTime(0.07,now); sg2.gain.exponentialRampToValueAtTime(0.001,now+0.05);
      src2.start(now); src2.stop(now+0.06);
    }

    /* Bass */
    note(BASS[bar]*0.5, now, 0.28, 'sawtooth', 0.12);

    /* Chord pads (tiap 4 step) */
    if (step%4===0) {
      CHORD[bar].forEach(f => note(f, now, 0.95, 'sine', 0.055));
    }
    /* Melodi */
    note(MELODY[step%MELODY.length], now, 0.26, 'triangle', 0.13);

    step++;
  }, Math.round(60000/BPM/2)); /* per 8th note */
}

/* ── Rekam ── */
let recorder, chunks=[];
function startRecording() {
  initAudio(); t=0; lastScene=-1; playing=true; recording=true;
  document.getElementById('gate').classList.add('off');
  startAudio();
  const vStream = cv.captureStream(30);
  const tracks = [...vStream.getVideoTracks(), ...(dest?dest.stream.getAudioTracks():[])];
  chunks=[]; recorder=new MediaRecorder(new MediaStream(tracks),{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm'});
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='genicare-demo-9x16.webm'; a.click();
    document.getElementById('st').textContent='Selesai! File genicare-demo-9x16.webm sudah diunduh.';
  };
  recorder.start();
  document.getElementById('st').textContent='Merekam video + musik (0–33 detik)... Mohon tunggu.';
}
function stopRecording() { recording=false; if(recorder&&recorder.state==='recording') recorder.stop(); }

function unlockAndPlay() {
  document.getElementById('gate').classList.add('off');
  playing=true; initAudio(); startAudio();
  document.getElementById('st').textContent='Memutar demo dengan musik & SFX...';
}

document.getElementById('gate').onclick = unlockAndPlay;
document.getElementById('playBtn').onclick = () => {
  if (!playing) unlockAndPlay();
  else { playing=false; document.getElementById('st').textContent='Dijeda'; }
};
document.getElementById('repBtn').onclick = () => { t=0; lastScene=-1; unlockAndPlay(); };
document.getElementById('muteBtn').onclick = e => {
  muted=!muted; e.target.textContent=muted?'Suara: Mati':'Suara: Nyala';
  if(!muted&&playing){initAudio();startAudio();}
  else if(muted){clearInterval(beatInterval);}
};
document.getElementById('recBtn').onclick = () => { if(!recording) startRecording(); };
</script>
</body>
</html>
